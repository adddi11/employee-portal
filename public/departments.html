<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Departments · Zentra HR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c3aed'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>Z</text></svg>" />
</head>
<body>
  <div class="app" id="app"></div>

  <div class="modal-back" id="dept-modal">
    <div class="modal">
      <div class="modal-head">
        <div><div class="modal-title" id="dept-modal-title">New Department</div>
        <div class="modal-sub">Departments can nest to form an org hierarchy</div></div>
        <button class="modal-x" data-close><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <form id="dept-form" class="form-grid">
          <div class="field full"><label>Name *</label><input name="name" required maxlength="80" placeholder="e.g. Customer Success" /></div>
          <div class="field"><label>Code *</label><input name="code" required maxlength="12" placeholder="e.g. CS" style="text-transform:uppercase" /></div>
          <div class="field"><label>Parent department</label><select name="parent_id" id="d-parent"></select></div>
          <div class="field"><label>Department head</label><select name="head_id" id="d-head"></select></div>
          <div class="field full"><label>Description</label><textarea name="description" maxlength="240" placeholder="What does this team own?"></textarea></div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close>Cancel</button>
        <button class="btn btn-primary" id="dept-save"><i data-lucide="plus"></i> Create</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <script src="js/app.js"></script>
  <script src="js/departments.js"></script>
</body>
</html>
